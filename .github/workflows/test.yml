name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest
        
        steps:
          - name: Checkout repository
            uses: actions/checkout@v4

          - name: Install dependencies 
            run: make all 
          - name: run the app
            run: make run

          
          
